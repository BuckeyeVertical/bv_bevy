# Builds the PX4 + Gazebo simulator image and publishes it as
# ghcr.io/buckeyevertical/bv-simulator, which ./px4.sh --prebuilt runs.
name: Simulator image

on:
  push:
    branches: [master]
    paths:
      - "gazebo/**"
      - ".github/workflows/simulator-image.yml"
  workflow_dispatch:

concurrency:
  group: simulator-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # PX4's build tree doesn't fit in the runner's free disk otherwise.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: gazebo
          target: px4-sitl
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/buckeyevertical/bv-simulator:latest
            ghcr.io/buckeyevertical/bv-simulator:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # Cached between runs, so a change outside PX4 (like px4/run.sh) doesn't recompile it.
          cache-from: type=gha
          cache-to: type=gha,mode=max
