services:
  simulator:
    container_name: bv-simulator
    image: ghcr.io/buckeyevertical/bv-simulator:latest
    platform: linux/amd64
    # No build section on purpose: --prebuilt must never start the long local build.
    # Docker Desktop and OrbStack define host.docker.internal; this makes Linux
    # do the same, for PX4's link to the host (see px4/run.sh).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:7001:7001"
      - "14580:14580/udp"
      - "18570:18570/udp"
    environment:
      # Set by ./px4.sh from the chosen world.
      PX4_HOME_LAT: ${PX4_HOME_LAT:-}
      PX4_HOME_LON: ${PX4_HOME_LON:-}
      PX4_HOME_ALT: ${PX4_HOME_ALT:-}
      BV_BRIDGE_CONFIG: /opt/bv/config/px4_x500_gimbal.json
      BV_PX4_WORLD: bv_mission
      BV_PX4_NAV_DLL_ACT: "0"
      BV_PX4_XY_VEL_MAX: "25"
      PX4_PARAM_SIM_BAT_MIN_PCT: "100"
